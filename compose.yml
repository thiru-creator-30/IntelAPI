services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelapi}
      POSTGRES_DB: ${POSTGRES_DB:-intelapi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelapi} -d ${POSTGRES_DB:-intelapi}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-intelapi}:${POSTGRES_PASSWORD:-intelapi}@db:5432/${POSTGRES_DB:-intelapi}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-intelapi}:${POSTGRES_PASSWORD:-intelapi}@db:5432/${POSTGRES_DB:-intelapi}
      WORKER_ID: worker-1
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app

volumes:
  pgdata:
